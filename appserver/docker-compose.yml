# 本地：docker compose up -d（仅 Postgres）

name: ihope-web

services:
  postgres:
    image: postgres:16-alpine
    container_name: ihope-web-postgres
    environment:
      POSTGRES_USER: ${WEB_DB_USER:-ihope_web}
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:-webdevpassword}
      POSTGRES_DB: ${WEB_DB_NAME:-ihope_web}
    ports:
      - "${WEB_DB_PORT:-5434}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

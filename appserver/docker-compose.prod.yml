# VPS: cp nginx.conf.example nginx.conf
# docker compose -f docker-compose.prod.yml up -d --build

name: ihope-web

services:
  postgres:
    image: postgres:16
    container_name: ihope-web-postgres
    environment:
      POSTGRES_USER: ${WEB_DB_USER:-ihope_web}
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env}
      POSTGRES_DB: ${WEB_DB_NAME:-ihope_web}
    volumes:
      - web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [ihope_web_net]

  appserver:
    build:
      context: ..
      dockerfile: appserver/Dockerfile
    container_name: ihope-web-appserver
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${WEB_DB_USER:-ihope_web}:${WEB_DB_PASSWORD}@postgres:5432/${WEB_DB_NAME:-ihope_web}?sslmode=disable
      HTTP_ADDR: ":8090"
      WEB_DIST: /app/web
      UPLOAD_DIR: /data/uploads
    volumes:
      - web_uploads_data:/data/uploads
      - ${QQ_QUOTES_HOST_DIR:-../deploy/quotes}:/opt/ihope/quotes:ro
      - ${QQ_POETRY_FONT_HOST_DIR:-../deploy/fonts}:/opt/ihope/fonts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [ihope_web_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ihope-web-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - appserver
    restart: unless-stopped
    networks: [ihope_web_net]

volumes:
  web_postgres_data:
  web_uploads_data:

networks:
  ihope_web_net:
